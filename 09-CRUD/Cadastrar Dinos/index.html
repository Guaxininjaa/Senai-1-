<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Dinossauros</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>🦖 CRUD Dinossauros 🦖</h1>

    <div id="form">
        <div class="container-inputs">
            <label for="input-nome">Nome:</label>
            <input id="input-nome" type="text">
        </div>
        
        <div class="container-inputs">
            <label for="input-altura">Altura:</label>
            <input id="input-altura" type="text">
        </div>
        
        <div class="container-inputs">
            <label for="input-cor">Cor:</label>
            <input id="input-cor" type="text">
        </div>
        
        <div class="container-inputs">
            <label for="input-custo">Custo:</label>
            <input id="input-custo" type="text">
        </div>
        
        <hr>
        
        <button class="btn" onclick="cadastrarDino()">➕</button>
        <button class="btn" onclick="limparDino()">➖</button>
    </div>
    
    <div id="resultado"></div>
    
    <script src="script.js"></script>
</body>

</html>
