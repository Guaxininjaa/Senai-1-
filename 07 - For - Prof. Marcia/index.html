<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="btn-resetar" onclick="resetar()">Resetar tudo</button>

    <div class="grid">

        <div class="card">
            <button onclick="exercicio1()">1 - Soma de 1 até 10</button>
            <div id="resultado1" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio2()">2 - Tabuada de 5</button>
            <div id="resultado2" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio3()">3 - Ao quadrado 1 até 10</button>
            <div id="resultado3" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio4()">4 - Letras de uma palavra</button>
            <div id="resultado4" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio5()">5 - Múltiplos de 3</button>
            <div id="resultado5" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio6()">6 - 10 asteriscos</button>
            <div id="resultado6" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio7()">7 - Soma dos pares</button>
            <div id="resultado7" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio8()">8 - De 0 até 50, de 5 em 5</button>
            <div id="resultado8" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio9()">9 - Olá! 8 vezes</button>
            <div id="resultado9" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio10()">10 - Soma dos ímpares (for)</button>
            <div id="resultado10" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio11()">11 - Soma dos ímpares (while)</button>
            <div id="resultado11" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio12()">12 - Sequência 1, 12, 123...</button>
            <div id="resultado12" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio13()">13 - Fatorial de 5</button>
            <div id="resultado13" class="resultado"></div>
        </div>

        <div class="card">
            <button onclick="exercicio14()">14 - Contar letra "o"</button>
            <div id="resultado14" class="resultado"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
